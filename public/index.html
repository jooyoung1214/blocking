<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>droptalk — 한 달에 한 칸, 모두가 쌓는 탑</title>
<meta name="description" content="블록 하나를 남기면 그게 기록이 됩니다. 한 사람에게 한 번, 한 달에 한 번.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 제도용지 */
  --paper:#e9eae4;
  --paper-2:#e1e2da;
  --rule:#c6c8bb;
  --rule-soft:#d6d8cc;
  --ink:#182830;
  --ink-2:#4a5a62;
  --ink-3:#7b8990;

  /* 발굴 단면 (보드 필드) */
  --field:#16222a;
  --field-grid:#233440;
  --field-edge:#0e171d;

  /* 사용자가 고른 블록 색이 그대로 UI 강조색이 된다 */
  --accent:#182830;
  --accent-ink:#ffffff;

  --gutter:46px;
  --panel:344px;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.45;
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── 상단 레일 ───────────────────────────────────────────── */
.rail{
  flex:0 0 auto; display:flex; align-items:baseline; gap:18px;
  padding:12px 20px 11px; border-bottom:1px solid var(--rule);
  background:var(--paper);
}
.wordmark{
  font-size:19px; font-weight:800; letter-spacing:-.045em;
  font-variation-settings:'opsz' 40;
}
.wordmark span{color:var(--ink-3)}
.rail-stats{
  display:flex; gap:16px; font-family:var(--mono); font-size:11px;
  color:var(--ink-2); letter-spacing:.02em;
}
.rail-stats b{font-weight:600; color:var(--ink)}
.rail-spacer{flex:1}
.conn{
  display:flex; align-items:center; gap:6px;
  font-family:var(--mono); font-size:11px; color:var(--ink-3);
}
.conn i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);display:block}
.conn.live i{background:#00a651}
.conn.dead i{background:#d13b3b}

/* ── 본문 ────────────────────────────────────────────────── */
.main{flex:1; display:flex; min-height:0}

/* ── 보드 ────────────────────────────────────────────────── */
.board-frame{
  position:relative; flex:1; min-width:0; margin:14px 0 14px 14px;
  border:1px solid var(--field-edge); border-radius:2px;
  background:var(--field); overflow:hidden;
}
#board{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.scroller{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; outline:none}
.scroller::-webkit-scrollbar{width:9px}
.scroller::-webkit-scrollbar-track{background:transparent}
.scroller::-webkit-scrollbar-thumb{background:#2f4552; border-radius:9px}
.spacer{width:1px}
.board-frame.aiming .scroller{cursor:crosshair; touch-action:none}
.board-frame.reading .scroller{cursor:default}

.empty-hint{
  position:absolute; left:50%; bottom:34px; transform:translateX(-50%);
  font-family:var(--mono); font-size:11px; color:#4d6472;
  letter-spacing:.06em; text-transform:uppercase; pointer-events:none;
}

/* 블록 정보 툴팁 */
.tip{
  position:absolute; z-index:40; pointer-events:none; opacity:0;
  transform:translateY(3px); transition:opacity .12s, transform .12s;
  background:var(--paper); border:1px solid var(--ink);
  border-radius:2px; padding:8px 10px; max-width:240px;
  box-shadow:3px 3px 0 rgba(24,40,48,.16);
}
.tip.on{opacity:1; transform:translateY(0)}
.tip-msg{font-size:15px; font-weight:600; letter-spacing:.06em; word-break:break-all}
.tip-msg.none{color:var(--ink-3); font-weight:400; letter-spacing:0; font-size:13px}
.tip-meta{
  font-family:var(--mono); font-size:10px; color:var(--ink-2);
  margin-top:4px; display:flex; gap:8px; flex-wrap:wrap;
}
.tip-swatch{
  display:inline-block; width:8px; height:8px; border:1px solid var(--ink);
  vertical-align:-1px; margin-right:5px;
}

/* ── 패널 ────────────────────────────────────────────────── */
.panel{
  flex:0 0 var(--panel); width:var(--panel); overflow-y:auto;
  padding:14px 16px 20px; display:flex; flex-direction:column; gap:14px;
  transition:opacity .18s;
}
.panel::-webkit-scrollbar{width:9px}
.panel::-webkit-scrollbar-thumb{background:var(--rule); border-radius:9px}
.panel.dim{opacity:.32; pointer-events:none}

.card{border:1px solid var(--rule); background:#eff0ea; border-radius:2px}
.card-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 12px; border-bottom:1px solid var(--rule);
  font-family:var(--mono); font-size:10px; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2);
}
.card-body{padding:12px}

.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field > label{
  display:block; font-family:var(--mono); font-size:10px; font-weight:500;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); margin-bottom:6px;
}
.hint{font-family:var(--mono); font-size:10px; color:var(--ink-3); margin-top:5px}
.hint.warn{color:#b3502a}

input[type=text]{
  width:100%; padding:8px 10px; border:1px solid var(--rule);
  background:var(--paper); color:var(--ink); border-radius:2px;
  font-family:var(--sans); font-size:14px;
}
input[type=text]:focus{outline:none; border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
#messageInput{
  font-family:var(--mono); font-size:16px; font-weight:500;
  letter-spacing:.34em; text-transform:uppercase;
}
#messageInput:disabled{background:var(--paper-2); color:var(--ink-3)}

/* 색 스와치 */
.swatches{display:grid; grid-template-columns:repeat(10,1fr); gap:4px}
.sw{
  aspect-ratio:1; border:1px solid rgba(24,40,48,.28); border-radius:2px;
  cursor:pointer; padding:0; position:relative; transition:transform .1s;
}
.sw:hover{transform:translateY(-2px)}
.sw[aria-pressed=true]{
  border-color:var(--ink); box-shadow:0 0 0 2px var(--paper), 0 0 0 3px var(--ink);
}
.sw:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

/* 모양 에디터 */
.editor{
  display:grid; grid-template-columns:repeat(10,1fr); gap:3px;
  background:var(--field); padding:7px; border-radius:2px;
  border:1px solid var(--field-edge);
}
.ec{
  aspect-ratio:1; border:1px solid #2a3f4c; background:#1b2a33;
  border-radius:1px; cursor:pointer; padding:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:11px; font-weight:600; color:transparent;
  transition:background .08s;
}
.ec:hover{background:#25384380}
.ec.on{background:var(--accent); border-color:rgba(255,255,255,.42); color:var(--accent-ink)}
.ec:focus-visible{outline:2px solid #fff; outline-offset:1px}

/* 버튼 */
.btn{
  width:100%; padding:11px 14px; border:1px solid var(--ink);
  background:var(--ink); color:var(--paper); border-radius:2px;
  font-family:var(--sans); font-size:14px; font-weight:600; letter-spacing:-.01em;
  cursor:pointer; transition:transform .08s, box-shadow .08s;
}
.btn:hover:not(:disabled){transform:translate(-1px,-1px); box-shadow:2px 2px 0 var(--ink-2)}
.btn:active:not(:disabled){transform:none; box-shadow:none}
.btn:disabled{background:transparent; color:var(--ink-3); border-color:var(--rule); cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--ink)}
.btn.ghost:hover:not(:disabled){background:var(--paper-2); box-shadow:2px 2px 0 var(--rule)}
.btn.accent{background:var(--accent); border-color:var(--ink); color:var(--accent-ink)}
.btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

.drops{
  display:flex; align-items:center; gap:7px; font-family:var(--mono);
  font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2);
}
.pip{width:9px; height:9px; border:1px solid var(--ink); border-radius:50%}
.pip.used{background:var(--ink)}

/* 아카이브 */
.archive{max-height:270px; overflow-y:auto}
.archive::-webkit-scrollbar{width:8px}
.archive::-webkit-scrollbar-thumb{background:var(--rule); border-radius:8px}
.arch-item{padding:10px 12px; border-bottom:1px solid var(--rule-soft)}
.arch-item:last-child{border-bottom:none}
.arch-msg{font-family:var(--mono); font-size:14px; font-weight:500; letter-spacing:.14em}
.arch-meta{font-family:var(--mono); font-size:10px; color:var(--ink-3); margin-top:3px}
.empty{
  padding:18px 12px; font-family:var(--mono); font-size:11px;
  color:var(--ink-3); line-height:1.7;
}

/* ── 조준 액션 바 ────────────────────────────────────────── */
.aimbar{
  flex:0 0 auto; display:none; align-items:center; gap:14px;
  padding:10px 16px; border-top:1px solid var(--ink); background:var(--paper-2);
}
.aimbar.on{display:flex}
.aim-read{
  font-family:var(--mono); font-size:11px; color:var(--ink-2);
  display:flex; gap:14px; flex-wrap:wrap; flex:1; min-width:0;
}
.aim-read b{color:var(--ink); font-weight:600}
.aim-read .hot{color:#0d7a3f; font-weight:600}
.nudge{
  width:34px; height:34px; padding:0; flex:0 0 auto;
  font-family:var(--mono); font-size:14px;
}
.aim-actions{display:flex; gap:8px; flex:0 0 auto}
.aim-actions .btn{width:auto; padding:9px 18px}
.aim-note{
  font-family:var(--mono); font-size:10px; color:var(--ink-3);
  letter-spacing:.04em;
}

/* ── 토스트 ──────────────────────────────────────────────── */
.toasts{
  position:fixed; right:16px; bottom:16px; z-index:80;
  display:flex; flex-direction:column-reverse; gap:8px; pointer-events:none;
}
.toast{
  background:var(--ink); color:var(--paper); padding:9px 13px;
  border-radius:2px; font-size:13px; max-width:320px;
  box-shadow:3px 3px 0 rgba(24,40,48,.2);
  animation:tin .22s ease-out, tout .3s ease-in 3.4s forwards;
}
.toast.bad{background:#a8321f}
@keyframes tin{from{opacity:0; transform:translateX(14px)}to{opacity:1; transform:none}}
@keyframes tout{to{opacity:0; transform:translateY(6px)}}

/* ── 모바일 ──────────────────────────────────────────────── */
@media (max-width:900px){
  :root{--gutter:34px}
  .main{flex-direction:column}
  .board-frame{margin:10px 10px 0; flex:1 1 auto; min-height:46vh}
  .panel{flex:0 0 auto; width:100%; max-height:46vh; padding:12px 10px 18px}
  .rail{padding:9px 12px; gap:10px; flex-wrap:wrap}
  .rail-stats{font-size:10px; gap:10px}
  .aimbar{flex-wrap:wrap; gap:10px}
  .aim-read{flex:1 1 100%}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>

<header class="rail">
  <div class="wordmark">droptalk<span>.</span></div>
  <div class="rail-stats">
    <span>시즌 <b id="statSeason">—</b></span>
    <span>블록 <b id="statBlocks">—</b></span>
    <span>높이 <b id="statRows">—</b></span>
  </div>
  <div class="rail-spacer"></div>
  <div class="conn" id="conn"><i></i><span id="connText">연결 중</span></div>
</header>

<div class="main">
  <div class="board-frame reading" id="frame">
    <canvas id="board"></canvas>
    <div class="scroller" id="scroller" tabindex="0"><div class="spacer" id="spacer"></div></div>
    <div class="empty-hint" id="emptyHint">아직 아무도 블록을 남기지 않았습니다</div>
    <div class="tip" id="tip"></div>
  </div>

  <aside class="panel" id="panel">
    <section class="card">
      <div class="card-head">
        <span>내 블록</span>
        <span class="drops" id="drops"></span>
      </div>
      <div class="card-body">
        <div class="field">
          <label for="nickInput">이름</label>
          <input type="text" id="nickInput" maxlength="15" placeholder="Anonymous" autocomplete="nickname">
        </div>

        <div class="field">
          <label>색</label>
          <div class="swatches" id="swatches"></div>
        </div>

        <div class="field">
          <label>모양 — 칸을 이어서 그리세요</label>
          <div class="editor" id="editor"></div>
          <div class="hint" id="shapeHint"></div>
        </div>

        <div class="field">
          <label for="messageInput">메시지 — 한 칸에 한 글자</label>
          <input type="text" id="messageInput" placeholder="칸을 먼저 그려주세요" disabled>
          <div class="hint" id="msgHint"></div>
        </div>

        <button class="btn" id="placeBtn" disabled>보드에 올리기</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><span>수확된 메시지</span><span id="archCount"></span></div>
      <div class="archive" id="archive"></div>
    </section>
  </aside>
</div>

<div class="aimbar" id="aimbar">
  <div class="aim-read" id="aimRead"></div>
  <button class="btn ghost nudge" id="nudgeL" title="왼쪽으로 한 칸">◀</button>
  <button class="btn ghost nudge" id="nudgeR" title="오른쪽으로 한 칸">▶</button>
  <div class="aim-actions">
    <button class="btn ghost" id="cancelBtn">취소</button>
    <button class="btn accent" id="confirmBtn">여기에 남기기</button>
  </div>
  <div class="aim-note" id="aimNote"></div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared/rules.js"></script>
<script src="/shared/board.js"></script>
<script src="/game.js"></script>
</body>
</html>
