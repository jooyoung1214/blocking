<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Tetris - Message Tower</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 20px;
            background-color: #0b0c10; color: #c5c6c7;
            font-family: 'Poppins', sans-serif;
            display: flex; gap: 20px; height: 100vh; box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1f2833; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #66fcf1; border-radius: 4px; }

        /* 토스트 알림 컨테이너 */
        #toast-container {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        .toast {
            background: rgba(31, 40, 51, 0.9); backdrop-filter: blur(10px);
            border: 1px solid #66fcf1; color: #fff; padding: 12px 20px;
            border-radius: 8px; font-size: 13px; font-weight: 600;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.2);
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
            pointer-events: auto;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(-10px); } }

        /* 게임 보드 영역 */
        #board-container {
            flex-grow: 1; height: 100%; max-height: calc(100vh - 40px);
            overflow-y: auto; background-color: #12141a; 
            border: 2px solid #1f2833; border-radius: 12px;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.05);
            position: relative;
        }
        canvas { display: block; margin: 0 auto; }

        /* 사이드바 영역 */
        .sidebar {
            display: flex; flex-direction: column; gap: 20px; 
            width: 400px; height: 100%; box-sizing: border-box;
            flex-shrink: 0; overflow-y: auto;
        }

        /* 패널 공통 스타일 */
        .panel { 
            background: rgba(31, 40, 51, 0.6); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 12px; 
            border: 1px solid rgba(102, 252, 241, 0.2);
            display: flex; flex-direction: column; gap: 12px;
        }

        h2, h3 { 
            margin: 0 0 10px 0; color: #66fcf1; 
            text-transform: uppercase; letter-spacing: 1px; font-weight: 800; font-size: 16px;
        }

        label { font-weight: 600; font-size: 13px; color: #45a29e; }
        
        input, select, button {
            padding: 12px; font-size: 14px; font-family: 'Poppins', sans-serif;
            border: none; border-radius: 6px; box-sizing: border-box; width: 100%;
            transition: all 0.2s ease;
        }
        input, select { background-color: #0b0c10; color: #fff; border: 1px solid #45a29e; }
        input:focus, select:focus { outline: none; box-shadow: 0 0 8px #66fcf1; }

        button { 
            background-color: #66fcf1; color: #0b0c10; 
            font-weight: 800; cursor: pointer; text-transform: uppercase;
        }
        button:hover { background-color: #45a29e; color: #fff; box-shadow: 0 0 15px rgba(102, 252, 241, 0.5); }
        button:disabled { background-color: #1f2833; color: #444; cursor: not-allowed; box-shadow: none; }
        
        .pay-btn { background-color: #ff4757; color: white; margin-top: 5px; }
        .pay-btn:hover { background-color: #ff6b81; box-shadow: 0 0 15px rgba(255, 71, 87, 0.5); }

        #shape-editor {
            display: grid; grid-template-columns: repeat(5, 40px); gap: 6px;
            background: #0b0c10; padding: 15px; border-radius: 8px; justify-content: center;
            border: 1px solid #1f2833;
        }
        .editor-cell {
            width: 40px; height: 40px; background: #1a1a24; border: 1px solid #2a2a35;
            border-radius: 4px; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: all 0.1s;
        }
        .editor-cell.active { background: #66fcf1; border-color: #fff; box-shadow: 0 0 10px #66fcf1; }
        .editor-cell input {
            width: 100%; height: 100%; text-align: center; font-size: 16px;
            background: transparent; border: none; color: #0b0c10; font-weight: 800; padding: 0;
        }
        .editor-cell input:focus { box-shadow: none; }

        #message-archive {
            display: flex; flex-direction: column; gap: 12px; 
            max-height: 250px; overflow-y: auto; padding-right: 5px;
        }
        .harvested-card {
            background: #0b0c10; padding: 15px; border-radius: 8px; 
            border-left: 4px solid #66fcf1; display: flex; flex-direction: column; gap: 8px;
            align-items: center; transition: transform 0.2s;
        }
        .harvested-card:hover { transform: translateY(-2px); }
        .harvested-header { width: 100%; display: flex; justify-content: space-between; font-size: 12px; color: #45a29e; font-weight: 600; }
        .harvested-canvas { background: #12141a; border-radius: 6px; padding: 5px; }

        @media (max-width: 1024px) {
            body { flex-direction: column; height: auto; overflow-y: auto; padding: 10px; }
            #board-container { width: 100%; height: 500px; max-height: 500px; }
            .sidebar { width: 100%; height: auto; overflow-y: visible; }
        }
    </style>
</head>
<body>
    
    <div id="toast-container"></div>

    <div id="board-container">
        <canvas id="gameCanvas"></canvas>
    </div>
    
    <div class="sidebar">
        <div class="panel">
            <h2>Command Center</h2>
            
            <label>Your Nickname</label>
            <input type="text" id="nicknameInput" value="Anonymous" maxlength="15">

            <label>1. Select Color</label>
            <select id="colorPicker">
                <option value="#ff4757">🔴 Neon Red</option>
                <option value="#ff6b81">🍑 Cyber Pink</option>
                <option value="#ffa502">🟠 Blaze Orange</option>
                <option value="#eccc68">🟡 Laser Yellow</option>
                <option value="#66fcf1" selected>🟢 Matrix Green</option>
                <option value="#1e90ff">🔵 Hologram Blue</option>
                <option value="#3742fa">🔷 Deep Neon Blue</option>
                <option value="#9c88ff">🟣 Plasma Purple</option>
                <option value="#e056fd">🌸 Synthwave Magenta</option>
                <option value="#ffffff">⚪ Pure White</option>
            </select>
            
            <label>2. Design Block (Max 10 Free)</label>
            <div id="shape-editor"></div>
            <div id="cell-count-info" style="font-size: 12px; color: #c5c6c7; text-align: center;">Selected: 0 cells</div>
            
            <label for="colInput">3. Drop Column (0-49)</label>
            <input type="number" id="colInput" min="0" max="49" value="25">
            
            <button id="dropBtn">Drop Payload</button>
            <button id="extraDropBtn" class="pay-btn" style="display:none;">Unlock Extra Drop ($10)</button>
        </div>

        <div class="panel">
            <h3>Data Archive</h3>
            <div id="message-archive">
                <div style="color: #45a29e; font-size: 13px; text-align: center; padding: 20px; font-weight: 600;">
                    Complete rows with matching colors to extract block data!
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
